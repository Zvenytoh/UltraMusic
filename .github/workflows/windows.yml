name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $package = @($metadata.packages | Where-Object name -eq 'ultramusic')
          if ($package.Count -ne 1 -or $env:GITHUB_REF_NAME -cne "v$($package[0].version)") {
            throw 'Release tag must exactly match the UltraMusic Cargo package version.'
          }
      - name: Audit dependencies
        shell: pwsh
        run: ./scripts/audit.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Install setup compiler
        shell: pwsh
        run: |
          $compiler = Get-ChildItem -Path @("${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe", "$env:ProgramFiles/Inno Setup */ISCC.exe") -ErrorAction SilentlyContinue
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UltraMusic-windows-x64
          path: target/distribution/UltraMusic-Setup.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name UltraMusic-windows-x64 --dir release
          cat > release-notes.md <<'NOTES'
          ## Install UltraMusic

          Download **UltraMusic-Setup.exe** below and follow the setup wizard.
          Setup installs UltraMusic for your Windows account, adds a Start menu
          shortcut and registers the application in Windows Installed apps.
          Microsoft Edge WebView2 is installed when needed.

          ### Included
          - A standard 32 logical pixel title row removes the unused space below the native Windows caption buttons.
          - Wide 40 px navigation targets are retained, with lighter, consistent icon strokes.
          - The Settings icon has a simpler, more open silhouette.
          - Keyboard focus is inset inside each toolbar button to avoid clipping at the window edge.
          - Native Windows caption controls, provider navigation and stored preferences are preserved.

          This refinement was checked statically and built by Windows CI. Final maximized,
          DPI and installer behavior were not rechecked interactively at the user's request.

          The appearance setting affects UltraMusic's host; music providers keep their own page themes.

          Requires Windows 11 x64 and an Internet connection. Music service
          accounts, subscriptions and playback availability are managed by each provider.

          The installer normalizes the local drive path sent by older update helpers.
          If updating still fails, quit UltraMusic and run the downloaded installer
          manually; provider sessions are retained.
          NOTES
          gh release create "$GITHUB_REF_NAME" release/UltraMusic-Setup.exe --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "UltraMusic $GITHUB_REF_NAME" --notes-file release-notes.md
