name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $package = @($metadata.packages | Where-Object name -eq 'ultramusic')
          if ($package.Count -ne 1 -or $env:GITHUB_REF_NAME -cne "v$($package[0].version)") {
            throw 'Release tag must exactly match the UltraMusic Cargo package version.'
          }
      - name: Audit dependencies
        shell: pwsh
        run: ./scripts/audit.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Install setup compiler
        shell: pwsh
        run: |
          $compiler = Get-ChildItem -Path @("${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe", "$env:ProgramFiles/Inno Setup */ISCC.exe") -ErrorAction SilentlyContinue
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UltraMusic-windows-x64
          path: target/distribution/UltraMusic-Setup.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name UltraMusic-windows-x64 --dir release
          cat > release-notes.md <<'NOTES'
          ## Install UltraMusic

          Download **UltraMusic-Setup.exe** below and follow the setup wizard.
          Setup installs UltraMusic for your Windows account, adds a Start menu
          shortcut and registers the application in Windows Installed apps.
          Microsoft Edge WebView2 is installed when needed.

          ### Included
          - Opaque title/toolbar painting fixes the gray overlay and white trailing strip.
          - Native caption buttons remain visible and keep their Windows behavior.
          - Clean vector Back, Forward, workspace and Settings icons replace font glyphs.
          - A 44 px header and evenly spaced controls align with Windows caption icons, including when maximized.
          - Quieter Segoe typography and a segmented appearance selector.
          - Settings fit their normal opening size without an unnecessary vertical scrollbar.
          - The volume slider remains visible after switching between dark and light themes.
          - Targeted visual/manual checks now supplement formatting, lint and compilation.

          The appearance setting affects UltraMusic's host; music providers keep their own page themes.

          Requires Windows 11 x64 and an Internet connection. Music service
          accounts, subscriptions and playback availability are managed by each provider.

          The installer normalizes the local drive path sent by older update helpers.
          If updating still fails, quit UltraMusic and run the downloaded installer
          manually; provider sessions are retained.
          NOTES
          gh release create "$GITHUB_REF_NAME" release/UltraMusic-Setup.exe --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "UltraMusic $GITHUB_REF_NAME" --notes-file release-notes.md
