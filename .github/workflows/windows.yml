name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Prepare standalone executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/distribution | Out-Null
          Copy-Item -LiteralPath target/release/ultramusic.exe -Destination target/distribution/UltraMusic.exe
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: UltraMusic-windows-x64
          path: target/distribution/UltraMusic.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish prototype download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name UltraMusic-windows-x64 --dir release
          cat > release-notes.md <<'NOTES'
          ## Télécharger UltraMusic

          Télécharger **UltraMusic.exe** dans les fichiers ci-dessous,
          puis double-cliquer sur le fichier pour lancer le lecteur.
          Aucune archive à extraire et aucun compte GitHub nécessaire.

          Windows 11 x64 et Microsoft Edge WebView2 Evergreen sont requis.

          **Prototype** : la connexion aux services, les DRM et la lecture prolongée
          restent à valider. Les performances CPU/GPU ne sont pas encore mesurées.
          NOTES
          gh release create "$GITHUB_REF_NAME" release/UltraMusic.exe --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$GITHUB_REF_NAME — Prototype Windows" --notes-file release-notes.md
