[package]
name = "ultramusic"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A minimal native Windows WebView2 music host"
readme = "README.md"
repository = "https://github.com/Zvenytoh/UltraMusic"
keywords = ["music", "webview2", "windows"]
categories = ["multimedia::audio"]

[build-dependencies]
winresource = "0.1.34"

[dependencies]
url = "2.5"
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
  "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
